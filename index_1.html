        label: 'Idiomas', icon: 'languages', title: 'Idiomas', main: 'name', sub: 'level',
        defaults: { percentage: 80 },
        fields: [
          { key: 'name', label: 'Idioma' },
          { key: 'level', label: 'Nivel (ej. Avanzado C1)' },
          { key: 'percentage', label: 'Dominio (0 a 100)', type: 'number' }
        ]
      },
      allies: {
        label: 'Aliados y clientes', icon: 'building-2', title: 'Empresas aliadas y clientes', main: 'name', sub: 'website_url',
        fields: [
          { key: 'name', label: 'Nombre' },
          { key: 'logo_url', label: 'Logo', type: 'image' },
          { key: 'website_url', label: 'Sitio web (https://)' }
        ]
      }
    };

    const EDITOR_TABS = [
      { key: 'personal', label: 'Datos personales', icon: 'user' },
      { key: 'media', label: 'Video y anexos (QR)', icon: 'video' },
      ...Object.entries(COLLECTIONS).map(([key, cfg]) => ({ key, label: cfg.label, icon: cfg.icon })),
      { key: 'appearance', label: 'Apariencia y secciones', icon: 'palette' }
    ];

    function fieldHTML(def, obj) {
      const value = obj[def.key];
      const attrs = `data-field="${def.key}" data-type="${def.type || 'text'}"`;
      const hint = def.hint ? `<span class="hint">${def.hint}</span>` : '';
      let control;

      switch (def.type) {
        case 'checkbox':
          return `<label class="check-row"><input type="checkbox" ${attrs} ${value ? 'checked' : ''} /> ${def.label}</label>`;
        case 'textarea':
          control = `<textarea class="form-control" rows="${def.rows || 3}" ${attrs}>${escapeHTML(value)}</textarea>`;
          break;
        case 'lines':
          control = `<textarea class="form-control" rows="${def.rows || 3}" ${attrs}>${escapeHTML(toArray(value).join('\n'))}</textarea>`;
          break;
        case 'csv':
          control = `<input class="form-control" ${attrs} value="${escapeHTML(toArray(value, ',').join(', '))}" />`;
          break;
        case 'select':
          control = `<select class="form-control" ${attrs}>${def.options.map(([val, text]) => `<option value="${escapeHTML(val)}" ${val === value ? 'selected' : ''}>${escapeHTML(text)}</option>`).join('')}</select>`;
          break;
        case 'number':
          control = `<input type="number" inputmode="decimal" class="form-control" ${attrs} value="${Number(value) || 0}" />`;
          break;
        case 'color':
          control = `<input type="color" class="form-control" style="height:42px;" ${attrs} value="${escapeHTML(value)}" />`;
          break;
        case 'image':
          control = `
            <div class="img-field">
              <input class="form-control" ${attrs} value="${escapeHTML(value)}" placeholder="foto.jpg" autocapitalize="off" />
              <label class="btn btn-secondary btn-sm" style="position:relative;"><i data-lucide="image"></i> Elegir<input type="file" accept="image/*" class="visually-hidden" data-pick /></label>
            </div>
            <span class="hint">${IMAGE_HINT}</span>`;
          break;
        default:
          control = `<input class="form-control" ${attrs} value="${escapeHTML(value)}" />`;
      }
      return `<div class="form-group ${def.wide ? 'wide' : ''}"><label>${def.label}</label>${control}${hint}</div>`;
    }

    /* Conecta los campos generados con fieldHTML al objeto que editan */
    function bindFields(container, getTarget, onChange) {
      container.querySelectorAll('[data-field]').forEach(el => {
        const handler = () => {
          const target = getTarget();
          const key = el.dataset.field;
          switch (el.dataset.type) {
            case 'checkbox': target[key] = el.checked; break;
            case 'number': target[key] = Number(el.value) || 0; break;
            case 'lines': target[key] = toArray(el.value); break;
            case 'csv': target[key] = toArray(el.value, ','); break;
            default: target[key] = el.value.trim();
          }
          onChange(key);
        };
        el.addEventListener('input', handler);
        /* Safari no siempre emite "input" en casillas y listas */
        if (el.type === 'checkbox' || el.tagName === 'SELECT') el.addEventListener('change', handler);
      });

      /* "Elegir": anota el nombre del archivo y lo muestra en la vista previa de esta sesión */
      container.querySelectorAll('[data-pick]').forEach(picker => {
        picker.addEventListener('change', () => {
          const file = picker.files[0];
          if (!file) return;
          sessionImages.set(file.name, URL.createObjectURL(file));
          const input = picker.closest('.img-field').querySelector('[data-field]');
          input.value = file.name;
          input.dispatchEvent(new Event('input'));
          showToast(`Recuerda copiar «${file.name}» en la misma carpeta de index.html`);
          picker.value = '';
        });
      });
    }

    let editorDirty = false;
    window.addEventListener('beforeunload', (e) => {
      if (!editorDirty) return;
      e.preventDefault();
      e.returnValue = '';
    });

    async function renderEditorView(slug, token) {
      const root = $('app-root');
      let cv = newBlankCV();
      let savedSlug = null;          // enlace con el que está guardada (null = nueva)

      if (slug) {
        root.innerHTML = loadingHTML('Cargando editor…');
        const row = await loadRow(slug);
        if (token !== routeToken) return;
        if (!row) return showNotFound();
        if (!canEdit(row)) return showNoPermission();
        cv = row.cv;
        savedSlug = slug;
      }

      let activeTab = 'personal';
      let editingIndex = -1;         // elemento de lista con el formulario abierto
      let previewTimer = null;

      document.title = `${savedSlug ? 'Editar' : 'Nueva'} hoja de vida | PMI CV Platform`;
      root.innerHTML = `
        <div class="editor-topbar" id="editor-topbar"></div>
        <div class="editor-shell">
          <nav class="editor-menu" aria-label="Apartados del editor">
            ${EDITOR_TABS.map(tab => `
              <button type="button" class="editor-tab-btn" data-tab="${tab.key}">
                <i data-lucide="${tab.icon}" style="width:16px;height:16px;"></i>
                <span>${tab.label}</span>
              </button>
            `).join('')}
          </nav>
          <section id="editor-form" class="editor-workspace"></section>
          <aside class="editor-live-preview" aria-label="Vista previa">
            <strong style="display:block; font-size:0.88rem; margin-bottom:0.75rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border-color);">
              <i data-lucide="eye" style="width:15px;height:15px;vertical-align:middle;"></i> Vista previa
            </strong>
            <div id="editor-preview" style="zoom:0.72;"></div>
          </aside>
        </div>
      `;

      const renderPreview = () => {
        const preview = $('editor-preview');
        if (!preview) return;
        preview.innerHTML = renderCVHTML(cv, { preview: true });
        refreshIcons();
        generateQRCodes(preview);
      };

      /* Marca cambios sin guardar y actualiza la vista previa */
      const touch = () => {
        editorDirty = true;
        const badge = $('dirty-badge');
        if (badge) badge.style.display = '';
        clearTimeout(previewTimer);
        previewTimer = setTimeout(renderPreview, 250);
      };

      const renderTopbar = () => {
        $('editor-topbar').innerHTML = `
          <div class="editor-topbar-title">
            <strong class="break">${savedSlug ? `Editando: ${escapeHTML(cv.profile.full_name)}` : 'Nueva hoja de vida'}</strong>
            <span class="badge badge-hybrid" id="dirty-badge" style="${editorDirty ? '' : 'display:none;'}">Cambios sin guardar</span>
          </div>
          <div class="editor-topbar-actions">
            <button type="button" class="btn btn-secondary btn-sm" id="ed-import"><i data-lucide="upload"></i> Importar JSON</button>
            <button type="button" class="btn btn-secondary btn-sm" id="ed-export"><i data-lucide="download"></i> Exportar JSON</button>
            ${savedSlug ? `
              <a href="#/cv/${encodeURIComponent(savedSlug)}" class="btn btn-secondary btn-sm"><i data-lucide="eye"></i> Ver</a>
              <button type="button" class="btn btn-danger btn-sm" id="ed-delete"><i data-lucide="trash-2"></i> Eliminar</button>
            ` : ''}
            <button type="button" class="btn btn-primary btn-sm" id="ed-save"><i data-lucide="save"></i> Guardar</button>
          </div>
        `;
        $('ed-import').addEventListener('click', () => $('import-file').click());
        $('ed-export').addEventListener('click', () => openExportModal(cv));
        $('ed-save').addEventListener('click', (e) => busy(e.currentTarget, save));
        $('ed-delete')?.addEventListener('click', remove);
        refreshIcons();
      };

      async function save() {
        const profile = cv.profile;
        if (!profile.full_name) {
          showToast('Escribe el nombre completo antes de guardar');
          return;
        }
        profile.slug = slugify(profile.slug || profile.full_name) || `cv-${Date.now().toString(36)}`;
        try {
          if (savedSlug) await updateCV(savedSlug, cv);
          else await insertCV(cv);
        } catch (err) {
          showToast(`No se pudo guardar: ${friendlyError(err)}`);
          return;
        }
        savedSlug = profile.slug;
        editorDirty = false;
        currentHash = `#/editar/${encodeURIComponent(savedSlug)}`;
        history.replaceState(null, '', currentHash);
        renderTopbar();
        renderForm();
        showToast('Hoja de vida guardada');
      }

      async function remove() {
        const ok = await confirmModal('Eliminar hoja de vida', `Se eliminará la hoja de vida de ${cv.profile.full_name}. Esta acción no se puede deshacer.`, 'Eliminar', true);
        if (!ok) return;
        try {
          await deleteCV(savedSlug);
        } catch (err) {
          showToast(`No se pudo eliminar: ${friendlyError(err)}`);
          return;
        }
        editorDirty = false;
        showToast('Hoja de vida eliminada');
        location.hash = '#/';
      }

      /* Importar: carga el JSON en el editor; se agrega a la base de datos al pulsar Guardar */
      $('import-file').onchange = async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;

        let imported;
        try {
          const raw = parseCommentedJSON(await file.text());
          if (!isObject(raw) || !isObject(raw.profile)) throw new Error('no contiene el apartado "profile" de una hoja de vida');
          imported = normalizeCV(raw);
        } catch (err) {
          showToast(`No se pudo importar el archivo: ${err.message}`);
          return;
        }

        if (savedSlug || editorDirty) {
          const ok = await confirmModal('Importar JSON', 'Los datos del archivo reemplazarán todo el contenido que ves en el editor.', 'Reemplazar');
          if (!ok) return;
        }
        /* Al editar una hoja de vida existente se conserva su enlace */
        if (savedSlug) imported.profile.slug = savedSlug;

        cv = imported;
        editingIndex = -1;
        renderForm();
        touch();

        const { local } = listMediaFiles(cv);
        showToast(local.length
          ? `Datos importados. Verifica que las ${local.length} imagen(es) estén en la carpeta de index.html y pulsa Guardar`
          : 'Datos importados. Revisa y pulsa Guardar para agregarlos a la base de datos');
      };

      const moveItem = (list, index, direction) => {
        const target = index + direction;
        if (target < 0 || target >= list.length) return false;
        [list[index], list[target]] = [list[target], list[index]];
        return true;
      };

      function renderCollectionForm(area, key) {
        const cfg = COLLECTIONS[key];
        const list = cv[key];

        area.innerHTML = `
          <h2 style="margin-bottom:0.85rem;">${cfg.title}</h2>
          ${list.length ? '' : `<p class="hint" style="margin-bottom:0.85rem;">Aún no hay elementos en este apartado.</p>`}
          ${list.map((item, i) => `
            <div class="crud-item-row">
              <label style="display:flex; align-items:center; gap:0.6rem; min-width:0;">
                <input type="checkbox" data-visible="${i}" ${item.is_visible !== false ? 'checked' : ''} title="Mostrar en la hoja de vida" />
                <span style="min-width:0;">
                  <strong data-row-title="${i}" class="break">${escapeHTML(item[cfg.main] || '(sin título)')}</strong>
                  <span class="hint" data-row-sub="${i}">${escapeHTML(item[cfg.sub])}</span>
                </span>
              </label>
              <div style="display:flex; gap:0.35rem; flex-shrink:0;">
                <button type="button" class="btn btn-secondary btn-sm" data-edit="${i}">${editingIndex === i ? 'Cerrar' : 'Editar'}</button>
                <button type="button" class="btn btn-secondary btn-sm" data-move="${i}" data-dir="-1" title="Subir">↑</button>
                <button type="button" class="btn btn-secondary btn-sm" data-move="${i}" data-dir="1" title="Bajar">↓</button>
                <button type="button" class="btn btn-danger btn-sm" data-delete="${i}" title="Eliminar"><i data-lucide="trash-2"></i></button>
              </div>
            </div>
            ${editingIndex === i ? `<div class="item-form"><div class="form-grid">${cfg.fields.map(f => fieldHTML(f, item)).join('')}</div></div>` : ''}
          `).join('')}
          <button type="button" class="btn btn-primary" id="add-item" style="margin-top:0.5rem;"><i data-lucide="plus"></i> Agregar</button>
        `;

        bindFields(area, () => list[editingIndex], (changed) => {
          const item = list[editingIndex];
          if (changed === cfg.main) area.querySelector(`[data-row-title="${editingIndex}"]`).textContent = item[cfg.main] || '(sin título)';
          if (changed === cfg.sub) area.querySelector(`[data-row-sub="${editingIndex}"]`).textContent = item[cfg.sub];
          touch();
        });

        area.querySelectorAll('[data-visible]').forEach(cb => cb.addEventListener('change', () => {
          list[Number(cb.dataset.visible)].is_visible = cb.checked;
          touch();
        }));
        area.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
          const i = Number(btn.dataset.edit);
          editingIndex = editingIndex === i ? -1 : i;
          renderForm();
        }));
        area.querySelectorAll('[data-move]').forEach(btn => btn.addEventListener('click', () => {
          if (!moveItem(list, Number(btn.dataset.move), Number(btn.dataset.dir))) return;
          editingIndex = -1;
          renderForm();
          touch();
        }));
        area.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', () => {
          list.splice(Number(btn.dataset.delete), 1);
          editingIndex = -1;
          renderForm();
          touch();
        }));
        $('add-item').addEventListener('click', () => {
          const item = { is_visible: true, ...clone(cfg.defaults || {}) };
          cfg.fields.forEach(f => { if (item[f.key] === undefined) item[f.key] = ''; });
          list.push(item);
          editingIndex = list.length - 1;
          renderForm();
          touch();
        });
      }

      function renderAppearanceForm(area) {
        area.innerHTML = `
          <h2 style="margin-bottom:1rem;">Apariencia</h2>
          <div class="form-grid" id="settings-fields">${SETTINGS_FIELDS.map(f => fieldHTML(f, cv.settings)).join('')}</div>

          <h3 style="margin:1.25rem 0 0.3rem; font-size:1rem;">Orden, títulos e íconos de las secciones</h3>
          <p class="hint" style="margin-bottom:0.6rem;">Ícono: ${ICON_HINT.toLowerCase()}.</p>
          ${cv.sections.map((sec, i) => `
            <div class="crud-item-row" style="flex-wrap:wrap;">
              <div style="display:flex; align-items:center; gap:0.5rem; flex:1; min-width:220px;">
                <input type="checkbox" data-sec="${i}" data-prop="is_visible" ${sec.is_visible !== false ? 'checked' : ''} title="Mostrar u ocultar la sección" />
                <input class="form-control" data-sec="${i}" data-prop="title" value="${escapeHTML(sec.title)}" style="flex:1; min-width:0;" aria-label="Título de la sección" />
                <input class="form-control" data-sec="${i}" data-prop="icon" value="${escapeHTML(sec.icon)}" style="width:120px;" aria-label="Ícono de la sección" autocapitalize="off" />
              </div>
              <div style="display:flex; gap:0.35rem; align-items:center;">
                <label style="font-size:0.75rem;"><input type="checkbox" data-sec="${i}" data-prop="start_collapsed" ${sec.start_collapsed ? 'checked' : ''} /> Inicia plegada</label>
                <button type="button" class="btn btn-secondary btn-sm" data-sec-move="${i}" data-dir="-1" title="Subir">↑</button>
                <button type="button" class="btn btn-secondary btn-sm" data-sec-move="${i}" data-dir="1" title="Bajar">↓</button>
              </div>
            </div>
          `).join('')}
        `;

        bindFields($('settings-fields'), () => cv.settings, touch);

        area.querySelectorAll('[data-sec]').forEach(el => {
          const handler = () => {
            cv.sections[Number(el.dataset.sec)][el.dataset.prop] = el.type === 'checkbox' ? el.checked : el.value.trim();
            touch();
          };
          el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', handler);
        });
        area.querySelectorAll('[data-sec-move]').forEach(btn => btn.addEventListener('click', () => {
          if (!moveItem(cv.sections, Number(btn.dataset.secMove), Number(btn.dataset.dir))) return;
          renderForm();
          touch();
        }));
      }

      function renderForm() {
        const area = $('editor-form');
        document.querySelectorAll('.editor-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === activeTab));

        if (activeTab === 'personal' || activeTab === 'media') {
          const personal = activeTab === 'personal';
          area.innerHTML = `
            <h2 style="margin-bottom:1rem;">${personal ? 'Datos personales y perfil' : 'Video de presentación y anexos'}</h2>
            <div class="form-grid">${(personal ? PROFILE_FIELDS : MEDIA_FIELDS).map(f => fieldHTML(f, cv.profile)).join('')}</div>
          `;
          bindFields(area, () => cv.profile, touch);
        } else if (activeTab === 'appearance') {
          renderAppearanceForm(area);
        } else {
          renderCollectionForm(area, activeTab);
        }
        refreshIcons();
      }

      document.querySelectorAll('.editor-tab-btn').forEach(btn => btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        editingIndex = -1;
        renderForm();
      }));

      renderTopbar();
      renderForm();
      renderPreview();
    }

    /* ==========================================================================
       14. ENRUTADOR
       Públicas:   #/  ·  #/cv/{slug}  ·  #/ingresar  ·  #/registro  ·  #/recuperar  ·  #/nueva-clave
       Con sesión: #/perfil  ·  #/nueva  ·  #/editar/{slug}  ·  #/usuarios (administrador)
       ========================================================================== */
    let currentHash = '';
    const PROTECTED = [/^#\/perfil$/, /^#\/nueva$/, /^#\/editar\//, /^#\/usuarios$/];

    function safeDecode(text) {
      try { return decodeURIComponent(text); } catch { return text; }
    }

    async function router() {
      const token = ++routeToken;
      const hash = location.hash.startsWith('#/') ? location.hash : '#/';
      currentHash = hash;

      closeModal();
      editorDirty = false;
      window.scrollTo(0, 0);

      if (PROTECTED.some(re => re.test(hash)) && !auth.user) {
        sessionStorage.setItem('volver', hash);
        showToast('Inicia sesión para continuar');
        history.replaceState(null, '', '#/ingresar');
        currentHash = '#/ingresar';
        return renderAuthView('ingresar');
      }

      const after = (prefix) => safeDecode(hash.slice(prefix.length).trim());

      if (hash.startsWith('#/cv/')) await renderCVView(after('#/cv/'), token);
      else if (AUTH_MODES[hash.slice(2)]) renderAuthView(hash.slice(2));
      else if (hash === '#/nueva-clave') renderNewPasswordView();
      else if (hash === '#/perfil') await renderProfileView(token);
      else if (hash === '#/usuarios') await renderUsersView(token);
      else if (hash === '#/nueva') await renderEditorView(null, token);
      else if (hash.startsWith('#/editar/')) await renderEditorView(after('#/editar/'), token);
      else await renderDirectoryView(token);
    }

    window.addEventListener('hashchange', () => {
      if (location.hash === currentHash) return;
      /* Enlace de correo abierto en una pestaña que ya tenía la página: se recarga para procesarlo */
      if (readAuthRedirect()) return location.reload();
      if (editorDirty && !window.confirm('Tienes cambios sin guardar. ¿Quieres salir sin guardarlos?')) {
        history.replaceState(null, '', currentHash);
        return;
      }
      router();
    });

    /* ==========================================================================
       15. INICIO
       ========================================================================== */
    async function start() {
      applySafariPrintFix();
      renderNav();
      $('app-root').innerHTML = loadingHTML('Conectando…');

      const redirect = readAuthRedirect();   // se lee antes de que Supabase limpie la dirección
      await connect();

      if (redirect) {
        const target = redirect.type === 'recovery' ? '#/nueva-clave' : '#/';
        history.replaceState(null, '', APP_URL + target);
        if (redirect.error) showToast('El enlace del correo no es válido o ya expiró. Solicita uno nuevo.');
        else if (redirect.message) showToast('Confirmación recibida. Abre también el enlace que llegó a tu otro correo.');
        else if (redirect.type === 'signup') showToast('¡Correo confirmado! Ya iniciaste sesión.');
        else if (redirect.type === 'email_change') showToast('Tu correo se actualizó correctamente.');
      }

      router();
    }

    start();
  </script>
</body>
</html>
