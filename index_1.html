<!DOCTYPE html>
<html lang="es" data-theme="corporate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f4c81" />
  <meta name="format-detection" content="telephone=no" />
  <title>Hojas de Vida | PMI CV Platform</title>
  
  <meta property="og:title" content="Plataforma de Hojas de Vida (Estándar PMI)" />
  <meta property="og:description" content="Portafolio ejecutivo de dirección de proyectos, KPIs, certificaciones y competencias bajo estándares PMI." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts (5 opciones seleccionables desde Apariencia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:wght@300;400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Librerías por CDN: íconos Lucide y generador de QR (Supabase se carga desde el script) -->
  <script defer src="https://unpkg.com/lucide@0.460.0"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    /* ==========================================================================
       1. VARIABLES CSS Y SISTEMA DE DISEÑO (:root)
       ========================================================================== */
    :root {
      --primary: #0f4c81;       /* Azul corporativo PMI */
      --secondary: #1e293b;     /* Slate oscuro */
      --accent: #d97706;        /* Ámbar ejecutivo para logros/KPIs */
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-muted: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
      --radius: 12px;           /* Configurable: 12px (Redondeado) o 2px (Cuadrado) */
      --avatar-radius: 50%;     /* 50% (Circular) o 6px (Cuadrado) */
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tema Oscuro */
    [data-theme="dark"] {
      --bg-body: #0b1120;
      --bg-card: #1e293b;
      --bg-muted: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    /* Tema Corporativo (Alto contraste limpio) */
    [data-theme="corporate"] {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-muted: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #334155;
      --border-color: #cbd5e1;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       2. RESET Y ESTILOS BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-family: var(--font-main);
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition), color var(--transition);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: opacity var(--transition);
    }

    a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 0.95rem;
      color: inherit;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* ==========================================================================
       3. BARRA SUPERIOR DE NAVEGACIÓN GLOBAL
       ========================================================================== */
    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary);
      text-decoration: none !important;
    }

    .brand-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--primary);
      color: #fff;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-weight: 600;
    }

    /* ==========================================================================
       4. BOTONES Y COMPONENTES COMUNES
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none !important;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-secondary {
      background: var(--bg-muted);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    .btn-accent {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-danger {
      background: #ef4444;
      color: #ffffff;
    }

    .btn-sm {
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-muted);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .badge-agile { background: #dcfce7; color: #166534; border-color: #86efac; }
    .badge-predictive { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .badge-hybrid { background: #fef3c7; color: #92400e; border-color: #fde68a; }

    /* ==========================================================================
       5. CONTENEDOR PRINCIPAL Y PANEL (#/)
       ========================================================================== */
    .main-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    .directory-hero {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .directory-hero h1 {
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      margin-bottom: 0.5rem;
    }

    .directory-hero p {
      opacity: 0.9;
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }

    .search-bar {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
      background: #ffffff;
      padding: 0.4rem;
      border-radius: var(--radius);
    }

    .search-bar input {
      flex: 1;
      border: none;
      padding: 0.6rem 0.8rem;
      color: #0f172a;
      background: transparent;
      outline: none;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .profile-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .profile-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .profile-card-avatar {
      width: 68px;
      height: 68px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 2px solid var(--primary);
      flex-shrink: 0;
    }

    /* ==========================================================================
       6. HOJA DE VIDA (#/cv/{slug})
       ========================================================================== */
    /* Barra de navegación rápida de secciones (Scroll Spy) */
    .cv-subnav {
      position: sticky;
      top: 57px;
      z-index: 90;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.5rem 0.8rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
    }

    .section-anchors {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .section-anchor {
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      text-decoration: none !important;
      transition: all var(--transition);
    }

    .section-anchor:hover, .section-anchor.active {
      background: var(--primary);
      color: #ffffff;
    }

    .accordion-controls {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    /* Layout del CV: Barra lateral + Contenido principal o 1 sola columna */
    .cv-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.75rem;
      align-items: start;
    }

    .cv-layout.single-column {
      grid-template-columns: 1fr;
    }

    @media (max-width: 960px) {
      .cv-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Barra Lateral del CV */
    .cv-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .cv-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    /* Hero / Encabezado en Barra Lateral o Superior */
    .hero-profile {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .hero-avatar {
      width: 128px;
      height: 128px;
      border-radius: var(--avatar-radius);
      object-fit: cover;
      border: 4px solid var(--primary);
      box-shadow: var(--shadow-md);
    }

    .hero-name {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-main);
    }

    .hero-headline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
    }

    .hero-location {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .contact-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      text-align: left;
      font-size: 0.86rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-main);
      word-break: break-all;
    }

    .contact-item i {
      color: var(--primary);
      flex-shrink: 0;
    }

    .hero-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* Acordeones Accesibles (<details>) */
    details.cv-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow var(--transition);
    }

    details.cv-section:hover {
      box-shadow: var(--shadow-md);
    }

    summary.cv-section-header {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      border-bottom: 1px solid transparent;
      transition: background-color var(--transition);
    }

    summary.cv-section-header::-webkit-details-marker {
      display: none;
    }

    details[open] > summary.cv-section-header {
      border-bottom-color: var(--border-color);
      background: var(--bg-muted);
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--text-main);
    }

    .section-icon-box {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      background: var(--primary);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .section-meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .count-pill {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
    }

    .chevron-icon {
      transition: transform var(--transition);
      color: var(--text-muted);
    }

    details[open] .chevron-icon {
      transform: rotate(180deg);
    }

    .cv-section-body {
      padding: 1.4rem;
    }

    /* Reproductor de Video 16:9 */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: #0f172a;
    }

    .video-container iframe, .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .print-video-fallback {
      display: none;
      padding: 1rem;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    /* Línea de Tiempo Vertical (Experiencia) */
    .timeline {
      position: relative;
      padding-left: 1.75rem;
      border-left: 2px solid var(--primary);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .timeline-item {
      position: relative;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.15rem;
      break-inside: avoid;
    }

    .timeline-dot {
      position: absolute;
      left: -2.25rem;
      top: 1.2rem;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--bg-card);
    }

    .exp-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .exp-company-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .company-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      object-fit: contain;
      background: #fff;
      padding: 4px;
      border: 1px solid var(--border-color);
    }

    .achievements-list {
      margin-top: 0.6rem;
      padding-left: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.92rem;
    }

    /* Tarjetas de Proyectos (Estándar PMI) */
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    .pmi-project-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 1.25rem;
      break-inside: avoid;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .pmi-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.65rem;
      background: var(--bg-card);
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      font-size: 0.84rem;
    }

    .pmi-meta-item strong {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .pmi-kpi-box {
      background: rgba(217, 119, 6, 0.08);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    /* Certificaciones e Insignias */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .cert-card {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
      break-inside: avoid;
    }

    .cert-badge-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
      background: #fff;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    /* Competencias y Talent Triangle del PMI */
    .skill-group {
      margin-bottom: 1.1rem;
    }

    .skill-group-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
      font-weight: 700;
    }

    .skill-item {
      margin-bottom: 0.65rem;
    }

    .skill-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      transition: width 0.8s ease-out;
    }

    .talent-triangle-box {
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1rem;
    }

    .triangle-bars {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    /* Empresas Aliadas / Clientes (Escala de grises a color) */
    .allies-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 0;
    }

    .ally-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      filter: grayscale(100%);
      opacity: 0.72;
      transition: all var(--transition);
    }

    .ally-item:hover {
      filter: grayscale(0%);
      opacity: 1;
      transform: scale(1.04);
    }

    .ally-logo {
      height: 42px;
      max-width: 120px;
      object-fit: contain;
    }

    /* Sección de Anexos y QR */
    .annexes-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      padding: 1.5rem;
      background: var(--bg-muted);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      break-inside: avoid;
    }

    .qr-canvas-wrap {
      background: #ffffff;
      padding: 0.85rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .qr-print-url {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
      max-width: 360px;
    }

    /* ==========================================================================
       7. EDITOR CON VISTA PREVIA
       ========================================================================== */
    .editor-shell {
      display: grid;
      grid-template-columns: 240px 1fr 400px;
      gap: 1.25rem;
      align-items: start;
    }

    @media (max-width: 1200px) {
      .editor-shell {
        grid-template-columns: 220px 1fr;
      }
      .editor-live-preview {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 768px) {
      .editor-shell {
        grid-template-columns: 1fr;
      }
    }

    .editor-menu {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);

    const $ = (id) => document.getElementById(id);
    const refreshIcons = () => window.lucide?.createIcons();
    const visible = (list) => (list || []).filter(item => item.is_visible !== false);
    const percent = (n) => Math.min(100, Math.max(0, Number(n) || 0));
    const toArray = (v, sep = '\n') =>
      (Array.isArray(v) ? v : String(v || '').split(sep)).map(s => String(s).trim()).filter(Boolean);
    const loadingHTML = (text) => `<p style="text-align:center; padding:2rem;" class="muted">${text}</p>`;

    function groupBy(list, keyFn) {
      return list.reduce((groups, item) => {
        const key = keyFn(item);
        (groups[key] = groups[key] || []).push(item);
        return groups;
      }, {});
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* Enlaces externos: solo https:// */
    function safeURL(url) {
      const v = String(url || '').trim();
      return /^https:\/\//i.test(v) ? v : '';
    }

    /* Imágenes elegidas con "Elegir" en esta sesión: se ven en la vista previa
       aunque todavía no se hayan copiado a la carpeta de index.html */
    const sessionImages = new Map();
    const isWebURL = (path) => /^https:\/\//i.test(String(path || '').trim());

    /* Imágenes y videos: enlace https:// o archivo ubicado en la carpeta de index.html */
    function mediaSrc(path) {
      const v = String(path || '').trim();
      if (!v) return '';
      if (sessionImages.has(v)) return sessionImages.get(v);
      if (isWebURL(v)) return v;
      if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.startsWith('//') || v.startsWith('\\')) return '';
      return v;
    }

    /* Ícono: nombre de Lucide (ej. "briefcase") o archivo de imagen / enlace https:// */
    function iconHTML(value, size = 16, style = '') {
      const v = String(value || '').trim();
      if (isWebURL(v) || /\.(png|jpe?g|gif|webp|svg)$/i.test(v)) {
        const src = mediaSrc(v);
        return src ? `<img src="${escapeHTML(src)}" alt="" class="icon-img" style="width:${size}px;height:${size}px;${style}" />` : '';
      }
      return `<i data-lucide="${escapeHTML(v || 'circle')}" style="width:${size}px;height:${size}px;${style}"></i>`;
    }

    function avatarHTML(profile, cssClass) {
      const src = mediaSrc(profile.avatar_url);
      if (src) return `<img src="${escapeHTML(src)}" alt="Foto de ${escapeHTML(profile.full_name)}" class="${cssClass}" />`;
      const initials = String(profile.full_name || '?').split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
      return `<div class="${cssClass} avatar-fallback" aria-hidden="true">${escapeHTML(initials)}</div>`;
    }

    function slugify(text) {
      return String(text || '')
        .normalize('NFD').replace(/[̀-ͯ]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 60);
    }

    const todayText = () => new Date().toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: 'numeric' });

    function dateText(value) {
      if (!value) return '—';
      return new Date(value).toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function timeAgo(value) {
      if (!value) return 'nunca';
      const minutes = Math.round((Date.now() - new Date(value).getTime()) / 60000);
      if (minutes < 1) return 'hace un momento';
      if (minutes < 60) return `hace ${minutes} min`;
      if (minutes < 1440) return `hace ${Math.round(minutes / 60)} h`;
      return dateText(value);
    }

    function showToast(message) {
      const el = document.createElement('div');
      el.className = 'toast';

      $('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 5000);

    const withTimeout = (promise, ms = 10000) => Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error('Tiempo de espera agotado')), ms))
    ]);

    /* Traduce los errores de Supabase a mensajes claros en español */
    const ERROR_TEXTS = [
      [/invalid login credentials/i, 'Correo o contraseña incorrectos.'],
      [/email not confirmed/i, 'Debes confirmar tu correo: abre el enlace que te enviamos al registrarte.'],
      [/already registered|already been registered|already exists/i, 'Ya existe una cuenta con ese correo. Inicia sesión o recupera tu contraseña.'],
      [/should be different|same.*password/i, 'La nueva contraseña debe ser distinta de la actual.'],
      [/password should|weak password|password is too|at least 6/i, 'La contraseña es muy débil: usa al menos 8 caracteres con letras y números.'],
      [/email address not authorized/i, 'Supabase no pudo enviar el correo a esa dirección: falta configurar un servidor de correo (SMTP) propio en Supabase.'],
      [/rate limit|too many|only request this after|security purposes/i, 'Demasiados intentos o correos seguidos. Espera unos minutos e inténtalo de nuevo.'],
      [/invalid.*email|unable to validate email|email.*invalid/i, 'El correo no es válido.'],
      [/jwt|session.*(missing|expired)|not authenticated|auth session missing/i, 'Tu sesión expiró. Vuelve a iniciar sesión.'],
      [/failed to fetch|networkerror|load failed|tiempo de espera/i, 'No hay conexión con la base de datos. Revisa tu internet e inténtalo de nuevo.']
    ];

    function friendlyError(err) {
      const code = err?.code;
      const msg = String(err?.message || err || '');
      if (code === '23505') return 'Ya existe una hoja de vida con ese enlace. Cámbialo en «Datos personales».';
      if (code === '42501' || /row-level security|permission denied|solo el administrador/i.test(msg)) return 'No tienes permiso para hacer esto.';
      if (code === '42P01' || code === '42883' || /^PGRST20/.test(code || '') || /could not find the (table|function)/i.test(msg)) {
        return 'Falta preparar la base de datos: ejecuta el archivo supabase.sql en Supabase.';
      }
      const found = ERROR_TEXTS.find(([re]) => re.test(msg));
      return found ? found[1] : (msg || 'Ocurrió un error inesperado.');
    }

    /* Muestra un mensaje dentro de un formulario */
    function formMessage(el, text, type = '') {
      el.className = `form-message ${type}`;
      el.textContent = text;
    }

    /* Desactiva un botón mientras se espera la respuesta */
    async function busy(button, task) {
      const label = button.innerHTML;
      button.disabled = true;
      button.textContent = 'Procesando…';
      try {
        return await task();
      } finally {
        button.disabled = false;
        button.innerHTML = label;
        refreshIcons();
      }
    }

    /* ---------- Modal único ---------- */
    let modalOnClose = null;

    function openModal(title, bodyHTML, onClose = null) {
      closeModal();
      $('modal-title').textContent = title;
      $('modal-body').innerHTML = bodyHTML;
      modalOnClose = onClose;
      $('modal').classList.add('open');
      refreshIcons();
      return $('modal-body');
    }

    function closeModal() {
      $('modal').classList.remove('open');
      const callback = modalOnClose;
      modalOnClose = null;
      if (callback) callback();
    }

    function confirmModal(title, text, okLabel, danger = false) {
      return new Promise(resolve => {
        let answer = false;
        const body = openModal(title, `
          <p>${escapeHTML(text)}</p>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" data-answer="no">Cancelar</button>
            <button type="button" class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-answer="yes">${escapeHTML(okLabel)}</button>
          </div>
        `, () => resolve(answer));
        body.querySelectorAll('[data-answer]').forEach(btn => btn.addEventListener('click', () => {
          answer = btn.dataset.answer === 'yes';
          closeModal();
        }));
      });
    }

    $('modal-close').addEventListener('click', closeModal);
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    /* ==========================================================================
       4. SESIÓN DE USUARIO (Supabase Auth)
       ========================================================================== */
    let sb = null;                                              // cliente de Supabase
    const auth = { user: null, profile: null, isAdmin: false }; // usuario actual
    let heartbeatTimer = null;

    function db() {
      if (!sb) throw new Error('No hay conexión con la base de datos. Revisa tu internet e inténtalo de nuevo.');
      return sb;
    }

    async function connect() {
      try {
        const { createClient } = await withTimeout(import(SUPABASE_LIB), 15000);
        sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
          auth: { flowType: 'implicit', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        const { data } = await withTimeout(sb.auth.getSession(), 15000);
        await setUser(data.session?.user || null);
        /* Cambios de sesión hechos en otra pestaña o al renovar el acceso */
        sb.auth.onAuthStateChange((event, session) => {
          setTimeout(async () => {
            const before = auth.user?.id || null;
            await setUser(session?.user || null);
            if (before !== (auth.user?.id || null)) router();
          }, 0);
        });
      } catch (err) {
        console.error('No se pudo conectar con Supabase:', err);
        sb = null;
      }
    }

    const displayName = () => auth.profile?.nombre || auth.user?.email || '';

    async function setUser(user) {
      const changed = (auth.user?.id || null) !== (user?.id || null);
      auth.user = user;
      auth.isAdmin = !!user && String(user.email || '').toLowerCase() === ADMIN_EMAIL;
      if (!user) {
        auth.profile = null;
        stopHeartbeat();
      } else if (changed || !auth.profile) {
        auth.profile = await loadMyProfile();
        startHeartbeat();
      } else if (auth.profile) {
        auth.profile.email = user.email;
      }
      renderNav();
    }

    async function loadMyProfile() {
      const fallback = { id: auth.user.id, email: auth.user.email, nombre: auth.user.user_metadata?.nombre || '', telefono: '', ciudad: '', profesion: '' };
      try {
        const { data, error } = await sb.from('perfiles').select('*').eq('id', auth.user.id).maybeSingle();
        if (error) throw error;
        if (data) return data;
        const created = await sb.from('perfiles').insert(fallback).select().maybeSingle();
        return created.data || fallback;
      } catch (err) {
        console.warn('Perfil no disponible:', err.message);
        return fallback;
      }
    }

    /* Avisa a la base de datos que el usuario está conectado (cada minuto) */
    function ping(online = true) {
      if (!sb || !auth.user) return Promise.resolve();
      return sb.rpc('marcar_conexion', { p_en_linea: online })
        .then(({ error }) => { if (error) console.warn('marcar_conexion:', error.message); }, () => {});
    }

    function startHeartbeat() {
      stopHeartbeat();
      ping();
      heartbeatTimer = setInterval(() => { if (document.visibilityState === 'visible') ping(); }, 60000);
    }

    function stopHeartbeat() {
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') ping();
    });

    async function logout() {
      await withTimeout(ping(false), 4000).catch(() => {});
      await sb?.auth.signOut().catch(() => {});
      await setUser(null);
      showToast('Sesión cerrada');
      if (location.hash === '#/' || !location.hash) router();
      else location.hash = '#/';
    }

    function renderNav() {
      const nav = $('nav-actions');
      if (!auth.user) {
        nav.innerHTML = `<a href="#/ingresar" class="btn btn-primary btn-sm" title="Iniciar sesión"><i data-lucide="log-in"></i><span class="nav-label">Iniciar sesión</span></a>`;
      } else {
        nav.innerHTML = `
          ${auth.isAdmin ? `<a href="#/usuarios" class="btn btn-secondary btn-sm" title="Usuarios"><i data-lucide="users"></i><span class="nav-label">Usuarios</span></a>` : ''}
          <a href="#/perfil" class="btn btn-secondary btn-sm" title="Mi perfil"><i data-lucide="user"></i><span class="nav-label nav-user-name">${escapeHTML(displayName())}</span></a>
          <button type="button" class="btn btn-secondary btn-sm" id="nav-logout" title="Cerrar sesión"><i data-lucide="log-out"></i><span class="nav-label">Salir</span></button>`;
        $('nav-logout').addEventListener('click', logout);
      }
      refreshIcons();
    }

    /* Lee el resultado de un enlace de correo de Supabase (#access_token=…&type=recovery) */
    function readAuthRedirect() {
      const hash = location.hash.slice(1);
      if (!/(^|&)(access_token|error_description|error_code|message)=/.test(hash)) return null;
      const params = new URLSearchParams(hash);
      return { type: params.get('type'), error: params.get('error_description'), message: params.get('message') };
    }

    /* ==========================================================================
       5. DATOS: HOJAS DE VIDA (tabla hojas_de_vida)
       ========================================================================== */
    /* El enlace guardado en la tabla manda sobre el que traiga el JSON */
    function withCV(row) {
      const cv = normalizeCV(row.data);
      cv.profile.slug = row.slug;
      return { ...row, cv };
    }
    const canEdit = (row) => !!auth.user && (auth.isAdmin || row.owner_id === auth.user.id);

    async function listCVs(ownerId = null) {
      let query = db().from(TABLE).select('slug, owner_id, data, updated_at').order('updated_at', { ascending: false });
      if (ownerId) query = query.eq('owner_id', ownerId);
      const { data, error } = await query;
      if (error) throw error;
      return data.map(withCV);
    }

    async function getCV(slug) {
      const { data, error } = await db().from(TABLE).select('slug, owner_id, data, updated_at').eq('slug', slug).maybeSingle();
      if (error) throw error;
      return data ? withCV(data) : null;
    }

    async function insertCV(cv) {
      const { error } = await db().from(TABLE).insert({ slug: cv.profile.slug, data: cv, owner_id: auth.user.id });
      if (error) throw error;
    }

    async function updateCV(oldSlug, cv) {
      const { data, error } = await db().from(TABLE).update({ slug: cv.profile.slug, data: cv }).eq('slug', oldSlug).select('slug');
      if (error) throw error;
      if (!data.length) throw { code: '42501' };
    }

    async function deleteCV(slug) {
      const { data, error } = await db().from(TABLE).delete().eq('slug', slug).select('slug');
      if (error) throw error;
      if (!data.length) throw { code: '42501' };
    }

    /* Lista todas las imágenes, íconos y videos que usa la hoja de vida */
    function listMediaFiles(cv) {
      const refs = [];
      const add = (path, label) => { if (String(path || '').trim()) refs.push({ path: String(path).trim(), label }); };
      const isIconFile = (v) => /\.(png|jpe?g|gif|webp|svg)$/i.test(String(v || ''));

      add(cv.profile.avatar_url, 'Foto de perfil');
      if (/\.(mp4|webm)$/i.test(cv.profile.video_url)) add(cv.profile.video_url, 'Video de presentación');
      cv.sections.filter(s => isIconFile(s.icon)).forEach(s => add(s.icon, `Ícono de la sección «${s.title}»`));
      cv.experiences.forEach(e => add(e.company_logo, `Logo de ${e.company || 'empresa'}`));
      cv.projects.forEach(p => add(p.client_logo, `Logo de ${p.client_name || 'cliente'}`));
      cv.certifications.forEach(c => add(c.badge_url, `Insignia de ${c.name || 'certificación'}`));
      cv.skills.filter(s => isIconFile(s.icon)).forEach(s => add(s.icon, `Ícono de la habilidad «${s.name}»`));
      cv.allies.forEach(a => add(a.logo_url, `Logo de ${a.name || 'aliado'}`));

      return {
        local: refs.filter(r => !isWebURL(r.path)),
        web: refs.filter(r => isWebURL(r.path))
      };
    }

    function toCommentedJSON(cv) {
      const lines = [];
      const comment = (text = '', indent = 0) => lines.push(`${' '.repeat(indent)}//${text ? ' ' + text : ''}`);
      const bar = '=====================================================================';
      const { local } = listMediaFiles(cv);

      comment(bar);
      comment(` HOJA DE VIDA: ${cv.profile.full_name || '(sin nombre)'}`);
      comment(` Archivo de datos exportado el ${todayText()} desde PMI CV Platform`);
      comment(bar);
      comment();
      comment(' ¿QUÉ ES ESTE ARCHIVO?');
      comment(' Contiene TODA la información de la hoja de vida. Las líneas que empiezan');
      comment(' con // son comentarios de ayuda: el programa las ignora al importar.');
      comment();
      comment(' ¿CÓMO AGREGARLO A LA BASE DE DATOS?');
      comment(' 1. Abre la página e inicia sesión con tu cuenta.');
      comment(' 2. Pulsa "Agregar nueva" (o "Editar" en una hoja de vida que ya exista).');
      comment(' 3. Pulsa "Importar JSON" y elige este archivo.');
      comment(' 4. Revisa la vista previa y pulsa "Guardar".');
      comment();
      comment(' IMÁGENES E ÍCONOS (MUY IMPORTANTE)');
      comment(' Este archivo NO lleva las imágenes por dentro: solo guarda su dirección');
      comment(' (el nombre del archivo). Para que se vean, copia cada imagen en la MISMA');
      comment(' CARPETA donde está index.html, con el nombre exacto que aparece aquí');
      comment(' (respeta mayúsculas, minúsculas y la extensión .jpg / .png).');
      comment(' Si la página está en GitHub Pages, sube las imágenes a la misma carpeta del repositorio.');
      comment();
      if (local.length) {
        comment(' Archivos que esta hoja de vida necesita en la carpeta de index.html:');
        local.forEach(ref => comment(`   - ${ref.path}   (${ref.label})`));
      } else {
        comment(' Esta hoja de vida no usa archivos de imagen locales por ahora.');
      }
      comment(' Las direcciones que empiezan por https:// son imágenes de internet: no hay que copiarlas.');
      comment();
      comment(' REGLAS PARA EDITARLO A MANO (por ejemplo con el Bloc de notas)');
      comment(' - Cambia solo el texto que está entre comillas, a la derecha de los dos puntos.');
      comment(' - No borres comillas, comas, llaves { } ni corchetes [ ].');
      comment(' - true = sí, false = no (se escriben sin comillas).');
      comment(bar);
      lines.push('{');

      const keys = Object.keys(JSON_HELP);
      keys.forEach((key, index) => {
        const help = JSON_HELP[key];
        const comma = index < keys.length - 1 ? ',' : '';
        lines.push('');
        comment(`---------- ${help.title} ----------`, 2);
        (help.notes || []).forEach(note => comment(note, 2));

        if (Array.isArray(cv[key])) {
          const body = JSON.stringify(cv[key], null, 2).split('\n').map((l, i) => (i ? '  ' + l : l)).join('\n');
          lines.push(`  "${key}": ${body}${comma}`);
        } else {
          lines.push(`  "${key}": {`);
          const entries = Object.entries(cv[key]);
          entries.forEach(([field, value], i) => {
            if (help.fields && help.fields[field]) comment(help.fields[field], 4);
            lines.push(`    ${JSON.stringify(field)}: ${JSON.stringify(value)}${i < entries.length - 1 ? ',' : ''}`);
          });
          lines.push(`  }${comma}`);
        }
      });

      lines.push('}');
      return lines.join('\n').replace(/\n/g, '\r\n');
    }

    /* Lee un JSON con o sin comentarios (de línea o de bloque) y tolera comas sobrantes */
    function parseCommentedJSON(text) {
      const source = String(text).replace(/^﻿/, '');
      let clean = '';
      let inString = false;

      for (let i = 0; i < source.length; i++) {
        const ch = source[i];
        const next = source[i + 1];
        if (inString) {
          clean += ch;
          if (ch === '\\') clean += source[++i] ?? '';
          else if (ch === '"') inString = false;
        } else if (ch === '"') {
          inString = true;
          clean += ch;
        } else if (ch === '/' && next === '/') {
          while (i < source.length && source[i] !== '\n') i++;
          clean += '\n';
        } else if (ch === '/' && next === '*') {
          i += 2;
          while (i < source.length && !(source[i] === '*' && source[i + 1] === '/')) i++;
          i++;
        } else {
          clean += ch;
        }
      }

      let result = '';
      inString = false;
      for (let i = 0; i < clean.length; i++) {
        const ch = clean[i];
        if (inString) {
          result += ch;
          if (ch === '\\') result += clean[++i] ?? '';
          else if (ch === '"') inString = false;
        } else if (ch === '"') {
          inString = true;
          result += ch;
        } else if (ch === ',' && /^\s*[}\]]/.test(clean.slice(i + 1))) {
          continue;
        } else {
          result += ch;
        }
      }
      return JSON.parse(result);
    }

    function downloadText(filename, text) {
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      /* Safari necesita que el enlace siga vivo un momento después del clic */
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    /* ==========================================================================
       7. APARIENCIA E IMPRESIÓN

    function applyVisualSettings(settings = DEFAULT_SETTINGS) {
      const s = { ...DEFAULT_SETTINGS, ...settings };
      const root = document.documentElement;
      const font = FONTS.includes(s.font_family) ? s.font_family : 'Inter';
      root.setAttribute('data-theme', s.theme);
      root.style.setProperty('--primary', s.primary_color);
      root.style.setProperty('--secondary', s.secondary_color);
      root.style.setProperty('--accent', s.accent_color);
      root.style.setProperty('--radius', s.border_style === 'square' ? '2px' : '12px');
      root.style.setProperty('--avatar-radius', s.border_style === 'square' ? '6px' : '50%');
      root.style.setProperty('--font-main', `'${font}', sans-serif`);
    }

    /* Safari (Mac, iPhone, iPad) no repite el encabezado de tabla en cada página:
       allí se usan márgenes normales. Safari no imprime la dirección del archivo
       a menos que se active «Imprimir encabezados y pies de página». */
    function applySafariPrintFix() {
      const ua = navigator.userAgent;
      const appleWebKit = /iP(hone|ad|od)/.test(ua)
        || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
        || (/Safari\//.test(ua) && !/Chrome|Chromium|CriOS|Edg|OPR|Firefox|FxiOS|Android/.test(ua));
      if (!appleWebKit) return;
      const style = document.createElement('style');
      style.textContent = `@media print {
        @page { size: A4 portrait; margin: 12mm 14mm; }
        .print-frame > thead, .print-frame > tfoot { display: none; }
        .print-frame, .print-frame > tbody, .print-frame > tbody > tr, .print-frame > tbody > tr > td { display: block; padding: 0; }
      }`;
      document.head.appendChild(style);
    }

    /* Al imprimir: fecha del día y todas las secciones desplegadas */
    let sectionsOpenBeforePrint = [];

    window.addEventListener('beforeprint', () => {
      document.querySelectorAll('.js-print-date').forEach(el => { el.textContent = todayText(); });
      const sections = Array.from(document.querySelectorAll('details.cv-section'));
      sectionsOpenBeforePrint = sections.map(d => d.open);
      sections.forEach(d => { d.open = true; });
    });

    window.addEventListener('afterprint', () => {
      document.querySelectorAll('details.cv-section').forEach((d, i) => {
        if (sectionsOpenBeforePrint[i] !== undefined) d.open = sectionsOpenBeforePrint[i];
      });
    });

    function methodologyBadgeClass(methodology = '') {
      const m = String(methodology).toLowerCase();
      if (m.includes('ágil') || m.includes('agil') || m.includes('agile')) return 'badge-agile';
      if (m.includes('predict')) return 'badge-predictive';
      return 'badge-hybrid';
    }

    /* Acepta enlaces normales de YouTube/Vimeo y los convierte al formato incrustable */
    function videoEmbed(url) {
      const v = String(url || '').trim();
      if (!v) return null;
      const youtube = v.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
      if (youtube) return { tag: 'iframe', src: `https://www.youtube.com/embed/${youtube[1]}`, link: v };
      const vimeo = v.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeo) return { tag: 'iframe', src: `https://player.vimeo.com/video/${vimeo[1]}`, link: v };
      if (/\.(mp4|webm)$/i.test(v)) {
        const src = mediaSrc(v);
        return src ? { tag: 'video', src, link: v } : null;
      }
      const src = safeURL(v);
      return src ? { tag: 'iframe', src, link: v } : null;
    }

    function generateQRCodes(container) {
      if (!window.QRCode) return;
      container.querySelectorAll('.cv-qr-canvas').forEach(canvas => {
        window.QRCode.toCanvas(canvas, canvas.dataset.url, {
          width: 148,
          margin: 1,
          color: { dark: '#0f172a', light: '#ffffff' }
        }, (err) => { if (err) console.warn('Error generando QR:', err); });
      });
    }

                      </div>
                    </div>
                    ${proj.methodology ? `<span class="badge ${methodologyBadgeClass(proj.methodology)}">Metodología ${escapeHTML(proj.methodology)}</span>` : ''}
                  </div>

                  ${proj.scope ? `<p style="font-size:0.9rem;"><strong>Alcance del proyecto:</strong> ${escapeHTML(proj.scope)}</p>` : ''}

                  <div class="pmi-meta-grid">
                    <div class="pmi-meta-item">
                      <strong>Presupuesto gestionado</strong>

                    </div>

                    <div class="pmi-meta-item">
                      <strong>Duración / Cronograma</strong>

                  </div>

                  ${proj.deliverables ? `<p style="font-size:0.88rem;"><strong>Entregables clave (WBS):</strong> ${escapeHTML(proj.deliverables)}</p>` : ''}

                  ${proj.kpis_results ? `
                    <div class="pmi-kpi-box">
                      <strong style="color:var(--accent); display:flex; align-items:center; gap:0.35rem; margin-bottom:0.2rem;">
                        <i data-lucide="bar-chart-3" style="width:16px;height:16px;"></i> KPIs y resultados medibles:

                  ${toArray(proj.knowledge_areas, ',').length ? `
                    <div style="display:flex; flex-wrap:wrap; gap:0.35rem; align-items:center;">
                      <span style="font-size:0.75rem; font-weight:700; margin-right:0.25rem;" class="muted">Áreas PMBOK®:</span>
                      ${toArray(proj.knowledge_areas, ',').map(area => `<span class="badge">${escapeHTML(area)}</span>`).join('')}

        case 'certifications': {

          return `
            <div class="certs-grid">

                  <div style="flex:1; min-width:0;">
                    <h3 style="font-size:0.95rem; font-weight:700;">${escapeHTML(cert.name)}</h3>
                    <p style="font-size:0.82rem; color:var(--primary); font-weight:600;">${escapeHTML(cert.issuer)}</p>
                    <p style="font-size:0.78rem; margin-top:0.25rem;" class="muted">

                      ${Number(cert.pdus) ? `<span class="badge">${Number(cert.pdus)} PDUs</span>` : ''}
                      ${cert.talent_triangle ? `<span class="badge">${escapeHTML(cert.talent_triangle)}</span>` : ''}
                    </div>
                    ${safeURL(cert.verify_url) ? `<a href="${escapeHTML(safeURL(cert.verify_url))}" target="_blank" rel="noopener noreferrer" style="display:inline-flex; align-items:center; gap:0.25rem; font-size:0.78rem; margin-top:0.45rem; font-weight:600;">Verificar credencial <i data-lucide="external-link" style="width:12px;height:12px;"></i></a>` : ''}

          const list = visible(cv.allies);

            <div class="allies-strip">

              </p>
              ${settings.show_qr ? `
                <div class="qr-canvas-wrap">
                  <canvas class="cv-qr-canvas" data-url="${escapeHTML(driveURL)}" aria-label="Código QR hacia la carpeta de anexos"></canvas>
                  <span class="qr-print-url">${escapeHTML(driveURL)}</span>

    function renderCVHTML(cv, { preview = false, editable = false } = {}) {
      const { profile, settings } = cv;
      applyVisualSettings(settings);

      const sections = visible(cv.sections)
        .map(sec => ({ ...sec, html: renderSectionContent(sec.section_key, cv) }))
        .filter(sec => sec.html);

      const countable = { experience: 'experiences', projects: 'projects', certifications: 'certifications', education: 'education', allies: 'allies' };

      const skills = visible(cv.skills);
      const skillGroups = Object.entries(groupBy(skills, sk => sk.category || 'Competencias Clave'));
      const languages = visible(cv.languages);

      /* PMI Talent Triangle®: promedio de las habilidades cuya categoría nombra cada lado */
      const triangle = TALENT_TRIANGLE.map(label => {
        const group = skills.filter(sk => String(sk.category || '').toLowerCase().includes(label.toLowerCase()));
        return group.length ? [label, Math.round(group.reduce((sum, sk) => sum + percent(sk.level), 0) / group.length)] : null;
      }).filter(Boolean);

      const bar = (value) => `<div class="progress-track"><div class="progress-fill" style="width:${percent(value)}%;"></div></div>`;

      const body = `
        <div class="print-only-header">
          <div><strong>${escapeHTML(profile.full_name)}</strong>${profile.headline ? ` — ${escapeHTML(profile.headline)}` : ''}</div>
          ${settings.show_print_date ? `<div>Fecha de impresión: <span class="js-print-date">${todayText()}</span></div>` : ''}
        </div>

        ${(!preview && sections.length) ? `
          <nav class="cv-subnav no-print" aria-label="Secciones de la hoja de vida">
            <div class="section-anchors">
              ${sections.map(sec => `<a href="#sec-${sec.section_key}" class="section-anchor" data-section-link="${sec.section_key}">${escapeHTML(sec.title)}</a>`).join('')}
            </div>
            <div class="accordion-controls">
              <button type="button" class="btn btn-secondary btn-sm" data-toggle-all="open" title="Expandir todo"><i data-lucide="chevrons-down"></i><span class="nav-label">Expandir</span></button>
              <button type="button" class="btn btn-secondary btn-sm" data-toggle-all="close" title="Plegar todo"><i data-lucide="chevrons-up"></i><span class="nav-label">Plegar</span></button>
            </div>
          </nav>` : ''}

        <div class="cv-layout ${settings.layout === 'single' ? 'single-column' : ''}">
          <aside class="cv-sidebar">
            <section class="cv-card hero-profile" aria-label="Datos principales">
              ${avatarHTML(profile, 'hero-avatar')}
              <h1 class="hero-name">${escapeHTML(profile.full_name || 'Nombre completo')}</h1>
              <p class="hero-headline">${escapeHTML(profile.headline)}</p>
              ${profile.location ? `<span class="hero-location"><i data-lucide="map-pin" style="width:15px;height:15px;"></i> ${escapeHTML(profile.location)}</span>` : ''}

              <div class="contact-list">
                ${profile.email ? `<div class="contact-item"><i data-lucide="mail" style="width:16px;height:16px;"></i> <a href="mailto:${escapeHTML(profile.email)}">${escapeHTML(profile.email)}</a></div>` : ''}
                ${profile.phone ? `<div class="contact-item"><i data-lucide="phone" style="width:16px;height:16px;"></i> <a href="tel:${escapeHTML(profile.phone)}">${escapeHTML(profile.phone)}</a></div>` : ''}
                ${safeURL(profile.linkedin_url) ? `<div class="contact-item"><i data-lucide="linkedin" style="width:16px;height:16px;"></i> <a href="${escapeHTML(safeURL(profile.linkedin_url))}" target="_blank" rel="noopener noreferrer">Perfil de LinkedIn</a></div>` : ''}
                ${safeURL(profile.website_url) ? `<div class="contact-item"><i data-lucide="globe" style="width:16px;height:16px;"></i> <a href="${escapeHTML(safeURL(profile.website_url))}" target="_blank" rel="noopener noreferrer">Portafolio web</a></div>` : ''}
              </div>

              ${!preview ? `
                <div class="hero-actions">
                  <button type="button" class="btn btn-primary" id="btn-print-cv"><i data-lucide="printer"></i> Imprimir / PDF</button>
                  <button type="button" class="btn btn-secondary" id="btn-share-cv"><i data-lucide="share-2"></i> Compartir</button>
                  ${editable ? `<a href="#/editar/${encodeURIComponent(profile.slug)}" class="btn btn-secondary" style="grid-column:1 / -1;"><i data-lucide="pencil"></i> Editar hoja de vida</a>` : ''}
                </div>` : ''}
            </section>

            ${skills.length ? `
              <section class="cv-card" aria-label="Competencias y habilidades">
                <h2 style="font-size:1.02rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem;">
                  <i data-lucide="cpu" style="color:var(--primary);"></i> Competencias Clave
                </h2>
                ${skillGroups.map(([category, list]) => `
                  <div class="skill-group">
                    <div class="skill-group-title">${escapeHTML(category)}</div>
                    ${list.map(sk => `
                      <div class="skill-item">
                        <div class="skill-label">
                          <span>${iconHTML(sk.icon || 'check-circle', 13, 'vertical-align:middle;color:var(--primary);')} ${escapeHTML(sk.name)}</span>
                          <span>${percent(sk.level)}%</span>
                        </div>
                        ${bar(sk.level)}
                      </div>
                    `).join('')}
                  </div>
                `).join('')}

                ${(settings.show_talent_triangle && triangle.length) ? `
                  <div class="talent-triangle-box">
                    <strong style="font-size:0.84rem; display:flex; align-items:center; gap:0.4rem; color:var(--primary);">
                      <i data-lucide="triangle" style="width:15px;height:15px;"></i> PMI Talent Triangle®
                    </strong>
                    <div class="triangle-bars">
                      ${triangle.map(([label, value]) => `
                        <div>
                          <div style="display:flex; justify-content:space-between; font-size:0.78rem; font-weight:600;">
                            <span>${label}</span><span>${value}%</span>
                          </div>
                          ${bar(value)}
                        </div>
                      `).join('')}
                    </div>
                  </div>` : ''}
              </section>` : ''}

            ${languages.length ? `
              <section class="cv-card" aria-label="Idiomas">
                <h2 style="font-size:1.02rem; font-weight:700; margin-bottom:0.85rem; display:flex; align-items:center; gap:0.5rem;">
                  <i data-lucide="languages" style="color:var(--primary);"></i> Idiomas
                </h2>
                ${languages.map(lang => `
                  <div class="skill-item">
                    <div class="skill-label">
                      <strong>${escapeHTML(lang.name)}</strong>
                      <span class="muted">${escapeHTML(lang.level)}</span>
                    </div>
                    ${bar(lang.percentage)}
                  </div>
                `).join('')}
              </section>` : ''}
          </aside>

          <div class="cv-main-content">
            ${sections.map(sec => {
              const count = countable[sec.section_key] ? visible(cv[countable[sec.section_key]]).length : null;
              return `
                <details id="sec-${sec.section_key}" class="cv-section" ${sec.start_collapsed ? '' : 'open'}>
                  <summary class="cv-section-header">
                    <div class="section-title-wrap">
                      <span class="section-icon-box">${iconHTML(sec.icon || 'layers', 18)}</span>
                      <span>${escapeHTML(sec.title)}</span>
                    </div>
                    <div class="section-meta">
                      ${count !== null ? `<span class="count-pill">${count} ${count === 1 ? 'elemento' : 'elementos'}</span>` : ''}
                      <i data-lucide="chevron-down" class="chevron-icon"></i>
                    </div>
                  </summary>
                  <div class="cv-section-body">${sec.html}</div>
                </details>`;
            }).join('')}
          </div>
        </div>
      `;

      if (preview) return body;

      /* Tabla de impresión: el encabezado y el pie vacíos son el margen de cada página */
      return `
        <table class="print-frame" role="presentation">
          <thead><tr><td><div class="print-space"></div></td></tr></thead>
          <tbody><tr><td>${body}</td></tr></tbody>
          <tfoot><tr><td><div class="print-space"></div></td></tr></tfoot>
        </table>`;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        /* Respaldo para navegadores que bloquean el portapapeles */
        const area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', '');
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        const ok = document.execCommand('copy');
        area.remove();
        return ok;
      }
    }

    function openShareModal(profile) {
      const shareURL = `${APP_URL}#/cv/${encodeURIComponent(profile.slug)}`;
      const text = `Conoce la hoja de vida de ${profile.full_name}${profile.headline ? ` (${profile.headline})` : ''}`;
      const body = openModal('Compartir hoja de vida', `
        <div class="share-grid">
          <button type="button" class="btn btn-primary" id="share-copy"><i data-lucide="copy"></i> Copiar enlace</button>
          <a href="https://wa.me/?text=${encodeURIComponent(text + ' ' + shareURL)}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><i data-lucide="message-circle"></i> WhatsApp</a>
          <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareURL)}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><i data-lucide="linkedin"></i> LinkedIn</a>
          <a href="mailto:?subject=${encodeURIComponent(text)}&body=${encodeURIComponent(shareURL)}" class="btn btn-secondary"><i data-lucide="mail"></i> Correo</a>
        </div>
        ${navigator.share ? `<button type="button" class="btn btn-accent btn-block" id="share-native" style="margin-top:0.6rem;"><i data-lucide="share-2"></i> Compartir desde el dispositivo</button>` : ''}
      `);
      body.querySelector('#share-copy').addEventListener('click', async () => {
        showToast(await copyText(shareURL) ? 'Enlace copiado al portapapeles' : `Copia este enlace: ${shareURL}`);
      });
      body.querySelector('#share-native')?.addEventListener('click', () => {
        navigator.share({ title: profile.full_name, text, url: shareURL }).catch(() => {});
      });
    }

    function messageCardHTML(title, text, link = '#/', linkLabel = 'Volver al panel principal') {
      return `
        <div class="cv-card" style="text-align:center; max-width:540px; margin:2rem auto; padding:2.5rem 1.5rem;">
          <h1 style="font-size:1.5rem; color:var(--primary); margin-bottom:0.5rem;">${title}</h1>
          <p class="muted" style="margin-bottom:1.5rem;">${text}</p>
          <a href="${link}" class="btn btn-primary"><i data-lucide="arrow-left"></i> ${linkLabel}</a>
        </div>`;
    }

    function showMessage(title, text, link, linkLabel) {
      applyVisualSettings();
      $('app-root').innerHTML = messageCardHTML(title, text, link, linkLabel);
      refreshIcons();
    }

    const showNotFound = () => showMessage('Hoja de vida no encontrada', 'La hoja de vida que buscas no existe o fue eliminada.');
    const showNoPermission = () => showMessage('Sin permiso', 'Solo el dueño de esta hoja de vida o el administrador pueden hacer esto.');

    async function loadRow(slug) {
      try {
        return await getCV(slug);
      } catch (err) {
        showToast(friendlyError(err));
        return null;
      }
    }

    async function renderCVView(slug, token) {
      const root = $('app-root');
      root.innerHTML = loadingHTML('Cargando hoja de vida…');

      const row = await loadRow(slug);
      if (token !== routeToken) return;
      if (!row) return showNotFound();

      const cv = row.cv;
      /* El título de la página es el nombre que el navegador propone para el PDF */
      document.title = `${cv.profile.full_name} - Hoja de vida`;
      root.innerHTML = renderCVHTML(cv, { editable: canEdit(row) });
      refreshIcons();
      generateQRCodes(root);

      root.querySelectorAll('[data-toggle-all]').forEach(btn => btn.addEventListener('click', () => {
        root.querySelectorAll('details.cv-section').forEach(d => { d.open = btn.dataset.toggleAll === 'open'; });
      }));

      root.querySelectorAll('.section-anchor').forEach(anchor => anchor.addEventListener('click', (e) => {
        e.preventDefault();
        const target = $(`sec-${anchor.dataset.sectionLink}`);
        if (target) {
          target.open = true;
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }));

      $('btn-print-cv').addEventListener('click', () => window.print());
      $('btn-share-cv').addEventListener('click', () => openShareModal(cv.profile));
    }

    /* ==========================================================================
       10. VISTAS DE ACCESO: ingresar, crear cuenta, recuperar y nueva contraseña
       ========================================================================== */
    const AUTH_MODES = {
      ingresar: { tab: 'Ingresar', title: 'Iniciar sesión' },
      registro: { tab: 'Crear cuenta', title: 'Crear una cuenta' },
      recuperar: { tab: 'Olvidé mi clave', title: 'Recuperar contraseña' }
    };

    const field = (id, label, type, autocomplete, extra = '') =>
      `<div class="form-group"><label for="${id}">${label}</label><input id="${id}" type="${type}" class="form-control" autocomplete="${autocomplete}" ${extra} /></div>`;

    function goAfterLogin() {
      const back = sessionStorage.getItem('volver') || '#/';
      sessionStorage.removeItem('volver');
      if (location.hash === back) router();
      else location.hash = back;
    }

    function renderAuthView(mode) {
      applyVisualSettings();
      document.title = `${AUTH_MODES[mode].title} | PMI CV Platform`;
      const root = $('app-root');

      if (!sb) {
        root.innerHTML = messageCardHTML('Sin conexión', 'No se pudo conectar con la base de datos. Revisa tu internet y recarga la página.');
        return refreshIcons();
      }
      if (auth.user) {
        location.hash = '#/perfil';
        return;
      }

      const forms = {
        ingresar: `
          ${field('au-email', 'Correo electrónico', 'email', 'username', 'required inputmode="email"')}
          ${field('au-pass', 'Contraseña', 'password', 'current-password', 'required')}
          <button type="submit" class="btn btn-primary btn-block"><i data-lucide="log-in"></i> Entrar</button>
          <p style="text-align:center; margin-top:0.85rem; font-size:0.86rem;"><a href="#/recuperar">¿Olvidaste tu contraseña?</a></p>`,
        registro: `
          ${field('au-name', 'Nombre completo', 'text', 'name', 'required')}
          ${field('au-email', 'Correo electrónico', 'email', 'username', 'required inputmode="email"')}
          ${field('au-pass', 'Contraseña (mínimo 8 caracteres)', 'password', 'new-password', 'required minlength="8"')}
          ${field('au-pass2', 'Repite la contraseña', 'password', 'new-password', 'required minlength="8"')}
          <button type="submit" class="btn btn-primary btn-block"><i data-lucide="user-plus"></i> Crear cuenta</button>`,
        recuperar: `
          <p class="muted" style="font-size:0.88rem; margin-bottom:0.85rem;">Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>
          ${field('au-email', 'Correo electrónico', 'email', 'username', 'required inputmode="email"')}
          <button type="submit" class="btn btn-primary btn-block"><i data-lucide="mail"></i> Enviar enlace</button>`
      };

      root.innerHTML = `
        <div class="cv-card auth-card">
          <h1 class="page-title">${AUTH_MODES[mode].title}</h1>
          <nav class="auth-tabs" aria-label="Opciones de acceso">
            ${Object.entries(AUTH_MODES).map(([key, m]) => `<a href="#/${key}" class="auth-tab ${key === mode ? 'active' : ''}">${m.tab}</a>`).join('')}
          </nav>
          <form id="auth-form" novalidate>${forms[mode]}</form>
          <div id="auth-msg" class="form-message"></div>
        </div>`;
      refreshIcons();

      const form = $('auth-form');
      const msg = $('auth-msg');
      const value = (id) => ($(id)?.value || '').trim();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = value('au-email').toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return formMessage(msg, 'Escribe un correo válido.', 'error');

        busy(form.querySelector('button[type="submit"]'), async () => {
          if (mode === 'ingresar') {
            const password = $('au-pass').value;
            if (!password) return formMessage(msg, 'Escribe tu contraseña.', 'error');
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) return formMessage(msg, friendlyError(error), 'error');
            await setUser(data.user);
            showToast(`Bienvenido, ${displayName()}`);
            goAfterLogin();
          }

          if (mode === 'registro') {
            const nombre = value('au-name');
            const password = $('au-pass').value;
            if (!nombre) return formMessage(msg, 'Escribe tu nombre.', 'error');
            if (password.length < 8) return formMessage(msg, 'La contraseña debe tener al menos 8 caracteres.', 'error');
            if (password !== $('au-pass2').value) return formMessage(msg, 'Las contraseñas no coinciden.', 'error');
            const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nombre }, emailRedirectTo: APP_URL } });
            if (error) return formMessage(msg, friendlyError(error), 'error');
            /* Supabase no revela si el correo ya existe: devuelve un usuario sin identidades */
            if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) {
              return formMessage(msg, 'Ya existe una cuenta con ese correo. Inicia sesión o recupera tu contraseña.', 'error');
            }
            if (data.session) {
              await setUser(data.user);
              showToast('Cuenta creada');
              location.hash = '#/perfil';
              return;
            }
            form.reset();
            formMessage(msg, `Te enviamos un correo a ${email}. Abre el enlace para confirmar tu cuenta y quedarás conectado.`, 'ok');
          }

          if (mode === 'recuperar') {
            const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: APP_URL });
            if (error) return formMessage(msg, friendlyError(error), 'error');
            formMessage(msg, `Si ${email} tiene una cuenta, recibirás un enlace para cambiar la contraseña. Revisa también la carpeta de spam.`, 'ok');
          }
        });
      });
    }

          ciudad: $('pf-ciudad').value.trim(),

          /* Se verifica la contraseña actual antes de cambiarla */
          const check = await sb.auth.signInWithPassword({ email: auth.user.email, password: current });
          if (check.error) return formMessage(msg, 'La contraseña actual no es correcta.', 'error');

          e.target.reset();
          formMessage(msg, 'Contraseña actualizada.', 'ok');
        });
      });

      $('pf-reset').addEventListener('click', (e) => busy(e.currentTarget, () => sendResetLink(auth.user.email)));
    }

    async function renderUsersView(token) {
      applyVisualSettings();
      document.title = 'Usuarios | PMI CV Platform';
      if (!auth.isAdmin) return showMessage('Solo para el administrador', 'Esta sección solo está disponible para la cuenta administradora.');

      const root = $('app-root');
      root.innerHTML = loadingHTML('Cargando usuarios…');

      let users = [];
      let rows = [];
      let query = '';
      const openUsers = new Set();

      const load = async () => {
        const [usersRes, cvs] = await Promise.all([db().rpc('lista_usuarios'), listCVs()]);
        if (usersRes.error) throw usersRes.error;
        users = usersRes.data || [];
        rows = cvs;
      };

      try {
        await load();
      } catch (err) {
        if (token !== routeToken) return;
        return showMessage('No se pudieron cargar los usuarios', escapeHTML(friendlyError(err)));
      }
      if (token !== routeToken) return;

      const render = () => {
        const q = query.trim().toLowerCase();
        const online = users.filter(u => u.conectado).length;
        const knownIds = new Set(users.map(u => u.id));
        const orphans = rows.filter(r => !knownIds.has(r.owner_id));
        const filtered = users.filter(u => !q || [u.nombre, u.email, u.ciudad, u.profesion].some(t => String(t || '').toLowerCase().includes(q)));

        root.innerHTML = `
          <h1 class="page-title"><i data-lucide="users"></i> Usuarios</h1>
          <div class="stats-row">
            <div class="stat"><strong>${users.length}</strong><span>usuarios registrados</span></div>
            <div class="stat"><strong>${online}</strong><span><span class="status-dot on"></span>conectados ahora</span></div>
            <div class="stat"><strong>${rows.length}</strong><span>hojas de vida</span></div>
          </div>
          <div class="directory-toolbar">
            <input type="search" id="us-search" class="form-control" placeholder="Buscar por nombre, correo o ciudad…" style="flex:1; min-width:200px;" aria-label="Buscar usuarios" />
            <button type="button" class="btn btn-secondary" id="us-refresh"><i data-lucide="refresh-cw"></i> Actualizar</button>
          </div>
          <div class="user-list">
            ${filtered.map(u => {
              const own = rows.filter(r => r.owner_id === u.id);
              const isOpen = openUsers.has(u.id);
              return `
                <article class="user-row">
                  <div style="min-width:0;">
                    <strong class="break"><span class="status-dot ${u.conectado ? 'on' : ''}"></span>${escapeHTML(u.nombre || '(sin nombre)')}</strong>
                    <div class="muted break">${escapeHTML(u.email)}</div>
                    <div style="display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.3rem;">
                      ${String(u.email).toLowerCase() === ADMIN_EMAIL ? `<span class="badge badge-predictive">Administrador</span>` : ''}
                      ${u.correo_confirmado ? '' : `<span class="badge badge-hybrid">Correo sin confirmar</span>`}
                    </div>
                  </div>
                  <div class="muted" style="min-width:0;">
                    <div><strong style="color:var(--text-main);">${u.conectado ? 'En línea ahora' : `Última actividad: ${escapeHTML(timeAgo(u.ultima_conexion || u.ultimo_ingreso))}`}</strong></div>
                    <div>Registrado: ${escapeHTML(dateText(u.registrado))}</div>
                    ${[u.telefono, u.ciudad, u.profesion].filter(Boolean).length ? `<div class="break">${escapeHTML([u.telefono, u.ciudad, u.profesion].filter(Boolean).join(' · '))}</div>` : ''}
                  </div>
                  <div class="row-actions">
                    <button type="button" class="btn btn-secondary btn-sm" data-toggle-user="${u.id}"><i data-lucide="files"></i> Hojas (${own.length})</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-reset="${escapeHTML(u.email)}"><i data-lucide="key-round"></i> Enviar cambio de clave</button>
                  </div>
                  ${isOpen ? `<div class="user-cvs">${own.length ? own.map(miniCVRowHTML).join('') : '<p class="hint">Este usuario no tiene hojas de vida.</p>'}</div>` : ''}
                </article>`;
            }).join('') || '<div class="cv-card empty-state">No hay usuarios con ese criterio.</div>'}
          </div>
          ${orphans.length ? `
            <section class="cv-card" style="margin-top:1.25rem;">
              <h2 class="card-title"><i data-lucide="folder-open"></i> Hojas de vida sin dueño (${orphans.length})</h2>
              <p class="hint" style="margin-bottom:0.6rem;">Se crearon antes de activar las cuentas o su dueño fue eliminado. Solo el administrador puede editarlas.</p>
              ${orphans.map(miniCVRowHTML).join('')}
            </section>` : ''}
        `;
        refreshIcons();

        const search = $('us-search');
        search.value = query;
        search.addEventListener('input', () => {
          query = search.value;
          render();
          const again = $('us-search');
          again.focus();
          again.setSelectionRange(again.value.length, again.value.length);
        });
        $('us-refresh').addEventListener('click', (e) => busy(e.currentTarget, refresh));
        root.querySelectorAll('[data-toggle-user]').forEach(btn => btn.addEventListener('click', () => {
          const id = btn.dataset.toggleUser;
          if (openUsers.has(id)) openUsers.delete(id); else openUsers.add(id);
          render();
        }));
        root.querySelectorAll('[data-reset]').forEach(btn => btn.addEventListener('click', async () => {
          const email = btn.dataset.reset;
          const ok = await confirmModal('Enviar enlace de contraseña', `Se enviará a ${email} un correo con un enlace para crear una contraseña nueva.`, 'Enviar');
          if (ok) busy(btn, () => sendResetLink(email));
        }));
      };

      const refresh = async () => {
        try {
          await load();
          if (token === routeToken && !$('modal').classList.contains('open')) render();
        } catch (err) {
          showToast(friendlyError(err));
        }
      };

      render();

      /* Se actualiza solo cada 30 segundos mientras esta vista esté abierta */
      const timer = setInterval(() => {
        if (token !== routeToken) return clearInterval(timer);
        if (document.visibilityState === 'visible' && document.activeElement?.id !== 'us-search') refresh();
      }, 30000);
    }
